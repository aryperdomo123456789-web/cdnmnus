# cdnmnus - template renderizado pelo install.sh
# Placeholders __...__ são substituídos durante a instalação.
# O pacote libnginx-mod-http-headers-more-filter e requisito do perfil CDN.
load_module /usr/lib/nginx/modules/ngx_http_headers_more_filter_module.so;

user www-data;
worker_processes auto;
worker_rlimit_nofile __WORKER_RLIMIT_NOFILE__;
pid /run/nginx.pid;
# Erros de upstream podem incluir a URI credenciada. Registre apenas eventos
# criticos; disponibilidade deve ser monitorada por metricas sanitizadas.
error_log /var/log/nginx/error.log crit;

events {
    use epoll;
    worker_connections __WORKER_CONNECTIONS__;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format cdnmnus '$remote_addr - $remote_user [$time_local] "$request_method" '
                       '$status $body_bytes_sent "$http_user_agent"';
    access_log off;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30s;
    keepalive_requests 1000;
    reset_timedout_connection on;
    server_tokens off;
    more_clear_headers Server;

    client_header_timeout 15s;
    client_body_timeout 30s;
    send_timeout 30s;
    client_max_body_size __CLIENT_MAX_BODY_SIZE__;

    client_body_buffer_size 16k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
    types_hash_max_size 2048;

    proxy_buffering on;
    proxy_buffer_size __PROXY_BUFFER_SIZE__;
    proxy_buffers __PROXY_BUFFERS__;
    proxy_busy_buffers_size __PROXY_BUSY_BUFFERS__;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_http_version 1.1;

    open_file_cache max=1000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rss+xml
        application/vnd.geo+json
        application/vnd.apple.mpegurl
        application/x-mpegURL
        audio/mpegurl
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-javascript
        application/xhtml+xml
        application/xml
        font/opentype
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream cdnmnus_backend {
        server __BACKEND_SERVER__ max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # O include dinâmico define X-Real-IP e o server público do upstream.
    # Carrega extensões locais sem reativar o site default da distribuição.
    include /etc/nginx/conf.d/*.conf;
}
