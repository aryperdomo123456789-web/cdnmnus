---
- name: Auditar pré-requisitos das edges sem alterar estado
  hosts: cdn_edges
  become: false
  gather_facts: true
  serial: 1
  any_errors_fatal: true
  tasks:
    - name: Validar sistema operacional e capacidade mínima
      ansible.builtin.assert:
        that:
          - ansible_distribution == 'Ubuntu'
          - ansible_distribution_major_version | int >= 20
          - ansible_memtotal_mb | int >= 3500
          - ansible_processor_vcpus | int >= 2
          - >-
            ((ansible_mounts | selectattr('mount', 'equalto', '/')
              | map(attribute='size_available') | first | int)
             / (ansible_mounts | selectattr('mount', 'equalto', '/')
                | map(attribute='size_total') | first | int)) >= 0.20
        quiet: true

    - name: Conferir sincronismo de relógio obrigatório para tokens e promoção
      ansible.builtin.command:
        argv:
          - timedatectl
          - show
          - --property=NTPSynchronized
          - --value
      register: edge_ntp_synchronized
      changed_when: false

    - name: Recusar nó com relógio não sincronizado
      ansible.builtin.assert:
        that: edge_ntp_synchronized.stdout | trim == 'yes'
        quiet: true

    - name: Conferir acesso TCP a cada origem XUI do snapshot candidato
      ansible.builtin.wait_for:
        host: "{{ item.origin.host }}"
        port: "{{ item.origin.port }}"
        timeout: 8
        state: started
      loop: "{{ tenant_contexts | default([]) }}"
      loop_control:
        label: "{{ item.tenant_id }}"

    - name: Conferir acesso TCP aos load balancers autorizados de cada tenant
      ansible.builtin.wait_for:
        host: "{{ upstream.host }}"
        port: "{{ upstream.port }}"
        timeout: 8
        state: started
      loop: "{{ tenant_contexts | map(attribute='load_balancers') | flatten }}"
      loop_control:
        loop_var: upstream
        label: "{{ upstream.host }}:{{ upstream.port }}"
      register: edge_lb_preflight
      failed_when: false

    - name: Registrar LBs temporariamente indisponíveis sem bloquear o rollout
      ansible.builtin.debug:
        msg:
          edge: "{{ inventory_hostname }}"
          unavailable_load_balancers: >-
            {{ edge_lb_preflight.results | default([])
               | selectattr('failed', 'defined')
               | selectattr('failed', 'equalto', true)
               | map(attribute='upstream.host') | list }}

    - name: Coletar serviços atualmente disponíveis
      ansible.builtin.service_facts:

    - name: Exibir resumo não sensível
      ansible.builtin.debug:
        msg:
          edge: "{{ inventory_hostname }}"
          os: "{{ ansible_distribution }} {{ ansible_distribution_version }}"
          vcpu: "{{ ansible_processor_vcpus }}"
          memory_mb: "{{ ansible_memtotal_mb }}"
          nginx: "{{ ansible_facts.services.get('nginx.service', {}).get('state', 'not-installed') }}"
