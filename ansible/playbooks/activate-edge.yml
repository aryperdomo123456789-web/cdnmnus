---
- name: Instalar e ativar runtime multi-tenant serialmente
  hosts: cdn_edges
  become: true
  serial: 1
  any_errors_fatal: true
  max_fail_percentage: 0
  vars:
    project_root: /opt/cdnmnus
    tls_fullchain_source: "/var/lib/cdnmnus-admin/tls-source/fullchain.pem"
    tls_privkey_source: "/var/lib/cdnmnus-admin/tls-source/privkey.pem"
  roles:
    - edge_base
    - cdn_runtime
    - cdn_tenants
