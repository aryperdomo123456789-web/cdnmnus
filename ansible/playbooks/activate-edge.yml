---
- name: Instalar e ativar runtime multi-tenant serialmente
  hosts: cdn_edges
  become: true
  serial: 1
  any_errors_fatal: true
  max_fail_percentage: 0
  vars:
    project_root: /opt/cdnmnus
    tls_fullchain_source: "/etc/letsencrypt/live/{{ canonical_health_host }}/fullchain.pem"
    tls_privkey_source: "/etc/letsencrypt/live/{{ canonical_health_host }}/privkey.pem"
  roles:
    - edge_base
    - cdn_runtime
    - cdn_tenants
