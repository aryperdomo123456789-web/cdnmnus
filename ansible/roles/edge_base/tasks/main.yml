---
- name: Instalar pacotes base da edge
  ansible.builtin.apt:
    name:
      - nginx
      - ufw
      - ca-certificates
      - curl
      - python3
      - socat
      - libnginx-mod-http-headers-more-filter
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Instalar limites do runtime CDN
  ansible.builtin.copy:
    content: |
      www-data soft nofile 131072
      www-data hard nofile 131072
      cdn-deploy soft nofile 65536
      cdn-deploy hard nofile 65536
    dest: /etc/security/limits.d/90-cdnmnus.conf
    owner: root
    group: root
    mode: '0644'

- name: Aplicar remoção global de fingerprint HTTP
  ansible.builtin.copy:
    content: |
      # Requer libnginx-mod-http-headers-more-filter instalada pelo role.
      server_tokens off;
      more_clear_headers Server;
    dest: /etc/nginx/conf.d/00-cdnmnus-security.conf
    owner: root
    group: root
    mode: '0644'

- name: Remover diretiva antiga duplicada do vhost padrão
  ansible.builtin.lineinfile:
    path: /etc/nginx/conf.d/97-cdnmnus-default.conf
    regexp: '^\s*server_tokens\s+'
    state: absent
  failed_when: false

- name: Instalar sysctl conservador da edge
  ansible.builtin.copy:
    content: |
      net.core.somaxconn = 16384
      net.ipv4.tcp_max_syn_backlog = 16384
      net.ipv4.tcp_tw_reuse = 1
      fs.file-max = 1048576
      vm.swappiness = 10
    dest: /etc/sysctl.d/90-cdnmnus.conf
    owner: root
    group: root
    mode: '0644'
  register: edge_sysctl

- name: Aplicar sysctl quando alterado
  ansible.builtin.command: sysctl --system
  when: edge_sysctl.changed
  changed_when: true

- name: Definir política UFW de entrada
  ansible.builtin.command: ufw default deny incoming
  changed_when: false

- name: Definir política UFW de saída
  ansible.builtin.command: ufw default allow outgoing
  changed_when: false

- name: Liberar HTTP público da CDN
  ansible.builtin.command: ufw allow 80/tcp comment 'cdnmnus-http'
  register: edge_ufw_http
  changed_when: "'Skipping adding existing rule' not in edge_ufw_http.stdout"

- name: Liberar SSH público da edge
  ansible.builtin.command: "ufw allow {{ cdnmnus_firewall_ssh_port | default(22) }}/tcp comment 'cdnmnus-ssh'"
  register: edge_ufw_ssh_public
  changed_when: "'Skipping adding existing rule' not in edge_ufw_ssh_public.stdout"

- name: Liberar HTTPS pública
  ansible.builtin.command: ufw allow 443/tcp comment 'cdnmnus-https'
  register: edge_ufw_https
  changed_when: "'Skipping adding existing rule' not in edge_ufw_https.stdout"

- name: Habilitar UFW
  ansible.builtin.command: ufw --force enable
  register: ufw_enable
  changed_when: "'Firewall is active' not in ufw_enable.stdout"

- name: Garantir UFW persistente após reboot
  ansible.builtin.systemd_service:
    name: ufw
    enabled: true

- name: Garantir diretórios da CDN
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: /opt/cdnmnus/runtime, owner: root, group: root, mode: '0755'}
    - {path: /opt/cdnmnus/releases, owner: root, group: root, mode: '0755'}
    - {path: /var/cache/nginx/cdnmnus, owner: www-data, group: www-data, mode: '0750'}

- name: Instalar helper root-only de become do Ansible
  ansible.builtin.copy:
    src: /opt/cdnmnus/scripts/cdnmnus-ansible-become
    dest: /usr/local/sbin/cdnmnus-ansible-become
    remote_src: true
    owner: root
    group: root
    mode: '0755'

- name: Restringir sudo do usuário de deployment ao helper do control plane
  ansible.builtin.copy:
    content: |
      Defaults:cdn-deploy env_keep += "SSH_CONNECTION"
      cdn-deploy ALL=(root) NOPASSWD: /usr/local/sbin/cdnmnus-ansible-become *
    dest: /etc/sudoers.d/cdn-deploy
    owner: root
    group: root
    mode: '0440'
    validate: /usr/sbin/visudo -cf %s
