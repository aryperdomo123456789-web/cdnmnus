---
- name: Instalar HAProxy exato e cliente do runtime socket
  ansible.builtin.apt:
    name: ["{{ load_balancer_haproxy_package }}={{ load_balancer_haproxy_version }}", socat]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Aplicar firewall do LB quando habilitado
  ansible.builtin.include_tasks: firewall.yml
  when: load_balancer_manage_firewall | bool

- name: Criar diretórios privados
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: /etc/haproxy/certs, group: haproxy, mode: '0750'}
    - {path: "{{ load_balancer_state_root }}", group: root, mode: '0750'}
    - {path: "{{ load_balancer_state_root }}/rollback/{{ load_balancer_change_id }}", group: root, mode: '0700'}

- name: Verificar caminhos que podem ser preservados no rollback
  ansible.builtin.stat:
    path: "/{{ item }}"
  loop:
    - etc/nginx
    - etc/cdnmnus
    - opt/cdnmnus/current
    - opt/cdnmnus/current.json
    - etc/systemd/system/cdnmnus-tenant-broker@.service
    - etc/systemd/system/cdnmnus-vod-relay@.service
  register: lb_backup_paths

- name: Montar lista de caminhos existentes para o rollback
  ansible.builtin.set_fact:
    lb_backup_existing_paths: "{{ (lb_backup_existing_paths | default([])) + [item.item] }}"
  loop: "{{ lb_backup_paths.results }}"
  when: item.stat.exists

- name: Preservar estado existente antes de preparar o papel LB
  ansible.builtin.command:
    argv: "{{ ['tar', '-C', '/', '-cpf', load_balancer_state_root + '/rollback/' + load_balancer_change_id + '/edge-before.tar'] + (lb_backup_existing_paths | default([])) }}"
  args:
    creates: "{{ load_balancer_state_root }}/rollback/{{ load_balancer_change_id }}/edge-before.tar"
  when: (lb_backup_existing_paths | default([])) | length > 0

- name: Proteger backup anterior ao papel LB
  ansible.builtin.file:
    path: "{{ load_balancer_state_root }}/rollback/{{ load_balancer_change_id }}/edge-before.tar"
    owner: root
    group: root
    mode: '0600'
- name: Instalar cadeia TLS versionada
  ansible.builtin.copy:
    src: "{{ load_balancer_tls_fullchain_source }}"
    dest: "/etc/haproxy/certs/{{ load_balancer_change_id }}.01-fullchain"
    owner: root
    group: haproxy
    mode: '0640'
  when: load_balancer_tls_enabled | bool
  no_log: true
- name: Instalar chave TLS versionada
  ansible.builtin.copy:
    src: "{{ load_balancer_tls_private_key_source }}"
    dest: "/etc/haproxy/certs/{{ load_balancer_change_id }}.02-private-key"
    owner: root
    group: haproxy
    mode: '0640'
  when: load_balancer_tls_enabled | bool
  no_log: true
- name: Montar PEM versionado
  ansible.builtin.assemble:
    src: /etc/haproxy/certs
    regexp: "^{{ load_balancer_change_id | regex_escape }}\\.0[12]-"
    dest: "{{ load_balancer_tls_pem_path }}"
    owner: root
    group: haproxy
    mode: '0640'
  when: load_balancer_tls_enabled | bool
  no_log: true
- name: Renderizar candidato sem alterar current
  ansible.builtin.template:
    src: haproxy.cfg.j2
    dest: "{{ load_balancer_candidate_path }}"
    owner: root
    group: haproxy
    mode: '0640'
- name: Validar candidato antes de publicar
  ansible.builtin.command:
    argv: [/usr/sbin/haproxy, -c, -f, "{{ load_balancer_candidate_path }}"]
  changed_when: false
- name: Registrar manifesto sem segredos
  ansible.builtin.copy:
    content: "change_id={{ load_balancer_change_id }}\npackage_target={{ load_balancer_haproxy_version }}\ncandidate={{ load_balancer_candidate_path }}\n"
    dest: "{{ load_balancer_state_root }}/rollback/{{ load_balancer_change_id }}/manifest.txt"
    owner: root
    group: root
    mode: '0600'

- name: Verificar helper root-only de become do Ansible no LB
  ansible.builtin.stat:
    path: /usr/local/sbin/cdnmnus-ansible-become
    checksum_algorithm: sha256
  register: ansible_become_helper

- name: Recusar LB sem helper de become aprovado
  ansible.builtin.assert:
    that:
      - ansible_become_helper.stat.exists
      - ansible_become_helper.stat.pw_name == 'root'
      - ansible_become_helper.stat.mode == '0755'
      - ansible_become_helper.stat.checksum == 'feebc69470e7f5628714e33df84945e8ae9f44547cac84351aabd4ad158ed5ad'
    fail_msg: 'helper de become ausente, inseguro ou divergente do pacote aprovado'
    quiet: true

- name: Restringir sudo do usuário de deployment ao helper no LB
  ansible.builtin.copy:
    content: |
      Defaults:cdn-deploy env_keep += "SSH_CONNECTION"
      Defaults:cdn-deploy !use_pty
      cdn-deploy ALL=(root) NOPASSWD: /usr/local/sbin/cdnmnus-ansible-become *
    dest: /etc/sudoers.d/cdn-deploy
    owner: root
    group: root
    mode: '0440'
    validate: /usr/sbin/visudo -cf %s
