---
# Nada é copiado para um diretório mutável de runtime. Os serviços executam
# pela release apontada em /opt/cdnmnus/current, tornando o código rollbackável.
- name: Conferir artefatos obrigatórios do runtime candidato
  ansible.builtin.stat:
    path: "/opt/cdnmnus/releases/{{ release_id }}/{{ item }}"
  loop:
    - runtime/token_broker.py
    - runtime/multi_tenant_broker.py
    - runtime/vod_relay.py
    - runtime/cdnmnus-tenant-broker@.service
    - runtime/cdnmnus-vod-relay@.service
  register: candidate_runtime_artifacts

- name: Impedir ativação de runtime incompleto
  ansible.builtin.assert:
    that:
      - candidate_runtime_artifacts.results | map(attribute='stat.exists') | min
      - candidate_runtime_artifacts.results | map(attribute='stat.isreg') | min
    quiet: true
