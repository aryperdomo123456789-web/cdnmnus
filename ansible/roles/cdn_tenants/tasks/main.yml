---
- name: Exigir release previamente sincronizada
  ansible.builtin.command:
    argv:
      - /usr/local/bin/cdnmnus-verify-release
      - "/opt/cdnmnus/releases/{{ release_id }}"
      - "{{ release_id }}"
      - "{{ config_digest }}"
  changed_when: false

- name: Verificar certificado TLS disponível no control node
  ansible.builtin.stat:
    path: "{{ tls_fullchain_source }}"
  delegate_to: localhost
  become: false
  register: tls_fullchain_local

- name: Verificar chave TLS disponível no control node
  ansible.builtin.stat:
    path: "{{ tls_privkey_source }}"
  delegate_to: localhost
  become: false
  register: tls_privkey_local

- name: Impedir ativação sem certificado TLS válido
  ansible.builtin.assert:
    that:
      - tls_fullchain_local.stat.exists
      - tls_privkey_local.stat.exists
    fail_msg: >-
      Certificado TLS ausente no control node. Distribua/renove o certificado
      antes de provisionar esta edge.
    quiet: true

- name: Criar diretório TLS da edge
  ansible.builtin.file:
    path: "/etc/letsencrypt/live/{{ canonical_health_host }}"
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Distribuir fullchain TLS por canal Ansible protegido
  ansible.builtin.copy:
    src: "{{ tls_fullchain_source }}"
    dest: "/etc/letsencrypt/live/{{ canonical_health_host }}/fullchain.pem"
    owner: root
    group: root
    mode: '0644'

- name: Distribuir chave privada TLS por canal Ansible protegido
  ansible.builtin.copy:
    src: "{{ tls_privkey_source }}"
    dest: "/etc/letsencrypt/live/{{ canonical_health_host }}/privkey.pem"
    owner: root
    group: root
    mode: '0600'

- name: Descobrir release ativa anterior
  ansible.builtin.command: readlink -f /opt/cdnmnus/current
  register: previous_release
  changed_when: false
  failed_when: false

- name: Verificar manifesto da release anterior
  ansible.builtin.stat:
    path: "{{ previous_release.stdout }}/manifest.json"
  register: previous_manifest_stat
  when: previous_release.rc == 0 and previous_release.stdout | length > 0

- name: Verificar snapshot da release anterior
  ansible.builtin.stat:
    path: "{{ previous_release.stdout }}/broker/tenants.json"
  register: previous_snapshot_stat
  when: previous_release.rc == 0 and previous_release.stdout | length > 0

- name: Definir se existe rollback anterior íntegro
  ansible.builtin.set_fact:
    previous_release_valid: >-
      {{
        previous_release.rc == 0
        and previous_release.stdout | length > 0
        and previous_manifest_stat.stat.exists | default(false)
        and previous_snapshot_stat.stat.exists | default(false)
      }}

- name: Ler manifesto da release anterior para rollback observável
  ansible.builtin.slurp:
    src: "{{ previous_release.stdout }}/manifest.json"
  register: previous_manifest
  when: previous_release_valid | bool

- name: Ler snapshot anterior para restaurar exatamente seus brokers
  ansible.builtin.slurp:
    src: "{{ previous_release.stdout }}/broker/tenants.json"
  register: previous_snapshot
  when: previous_release_valid | bool

- name: Descobrir units instaladas antes da ativação
  ansible.builtin.stat:
    path: "/etc/systemd/system/{{ item }}"
  loop:
    - cdnmnus-tenant-broker@.service
    - cdnmnus-vod-relay@.service
  register: previous_unit_stats

- name: Preservar conteúdo das units anteriores para rollback
  ansible.builtin.slurp:
    src: "/etc/systemd/system/{{ item.item }}"
  loop: "{{ previous_unit_stats.results }}"
  when: item.stat.exists
  register: previous_units

- name: Verificar estado observável anterior
  ansible.builtin.stat:
    path: /opt/cdnmnus/current.json
  register: previous_current_json_stat

- name: Criar histórico persistente da ativação
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0700'
  loop:
    - /var/lib/cdnmnus-edge
    - /var/lib/cdnmnus-edge/activation-history
    - "/var/lib/cdnmnus-edge/activation-history/{{ release_id }}"

- name: Preservar units anteriores no histórico persistente
  ansible.builtin.copy:
    src: "/etc/systemd/system/{{ item.item }}"
    dest: "/var/lib/cdnmnus-edge/activation-history/{{ release_id }}/{{ item.item }}"
    remote_src: true
    owner: root
    group: root
    mode: '0600'
  loop: "{{ previous_unit_stats.results }}"
  when: item.stat.exists

- name: Preservar estado observável anterior no histórico
  ansible.builtin.copy:
    src: /opt/cdnmnus/current.json
    dest: "/var/lib/cdnmnus-edge/activation-history/{{ release_id }}/current.json"
    remote_src: true
    owner: root
    group: root
    mode: '0600'
  when: previous_current_json_stat.stat.exists

- name: Registrar contrato fechado de rollback da ativação
  ansible.builtin.copy:
    content: >-
      {{ {'schema_version': 1,
          'activated_release_id': release_id,
          'previous_release_id': (previous_manifest.content | b64decode | from_json).release_id,
          'previous_config_digest': (previous_manifest.content | b64decode | from_json).config_digest,
          'tenant_broker_unit_existed': previous_unit_stats.results[0].stat.exists,
          'vod_relay_unit_existed': previous_unit_stats.results[1].stat.exists,
          'current_json_existed': previous_current_json_stat.stat.exists}
         | to_nice_json }}
    dest: "/var/lib/cdnmnus-edge/activation-history/{{ release_id }}/rollback.json"
    owner: root
    group: root
    mode: '0600'
  when: previous_release_valid | bool

- name: Ativar e validar release com rollback
  block:
    - name: Apontar current atomicamente para release candidata
      ansible.builtin.shell:
        cmd: >-
          set -eu;
          ln -sfn '/opt/cdnmnus/releases/{{ release_id }}' /opt/cdnmnus/.current-next;
          mv -Tf /opt/cdnmnus/.current-next /opt/cdnmnus/current
        executable: /bin/sh
      register: active_release_link
      changed_when: previous_release.stdout != '/opt/cdnmnus/releases/' + release_id

    - name: Instalar units da release candidata
      ansible.builtin.copy:
        src: "/opt/cdnmnus/current/runtime/{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        remote_src: true
        owner: root
        group: root
        mode: '0644'
      loop:
        - cdnmnus-tenant-broker@.service
        - cdnmnus-vod-relay@.service
      register: candidate_units

    - name: Recarregar systemd para as units candidatas
      ansible.builtin.systemd_service:
        daemon_reload: true
      when: candidate_units.changed

    - name: Criar diretórios de cache por tenant
      ansible.builtin.file:
        path: "/var/cache/nginx/cdnmnus/{{ item }}"
        state: directory
        owner: www-data
        group: www-data
        mode: '0750'
      loop: "{{ vod_tenant_ids | default([]) }}"

    - name: Remover site padrão da distribuição
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      register: nginx_default_removed

    - name: Instalar servidor padrão fail-closed
      ansible.builtin.copy:
        content: |
          server_tokens off;
          server {
              listen 80 default_server;
              server_name _;
              return 421;
          }
          server {
              listen 443 ssl default_server;
              server_name _;
              ssl_certificate /etc/letsencrypt/live/{{ canonical_health_host }}/fullchain.pem;
              ssl_certificate_key /etc/letsencrypt/live/{{ canonical_health_host }}/privkey.pem;
              return 421;
          }
        dest: /etc/nginx/conf.d/97-cdnmnus-default.conf
        owner: root
        group: root
        mode: '0644'
      register: nginx_fail_closed

    - name: Instalar include do runtime multi-tenant
      ansible.builtin.copy:
        content: |
          include /opt/cdnmnus/current/nginx/tenants/*.conf;
        dest: /etc/nginx/conf.d/98-cdnmnus-tenants.conf
        owner: root
        group: root
        mode: '0644'
      register: tenant_nginx_include

    - name: Habilitar brokers dos tenants
      ansible.builtin.systemd_service:
        name: "cdnmnus-tenant-broker@{{ item }}.service"
        enabled: true
        state: started
      loop: "{{ tenant_ids }}"

    - name: Habilitar relays VOD dos tenants
      ansible.builtin.systemd_service:
        name: "cdnmnus-vod-relay@{{ item }}.service"
        enabled: true
        state: started
      loop: "{{ vod_tenant_ids | default([]) }}"

    - name: Validar Nginx candidato
      ansible.builtin.command: nginx -t
      changed_when: false

    - name: Reiniciar brokers para carregar o snapshot candidato
      ansible.builtin.systemd_service:
        name: "cdnmnus-tenant-broker@{{ item }}.service"
        state: restarted
      loop: "{{ tenant_ids }}"

    - name: Reiniciar relays VOD para carregar o snapshot candidato
      ansible.builtin.systemd_service:
        name: "cdnmnus-vod-relay@{{ item }}.service"
        state: restarted
      loop: "{{ vod_tenant_ids | default([]) }}"

    - name: Habilitar Nginx
      ansible.builtin.systemd_service:
        name: nginx
        enabled: true
        state: started

    - name: Recarregar Nginx quando a configuração mudou
      ansible.builtin.systemd_service:
        name: nginx
        state: reloaded
      when: active_release_link.changed or tenant_nginx_include.changed
            or nginx_default_removed.changed or nginx_fail_closed.changed

    - name: Validar health local por tenant
      ansible.builtin.uri:
        url: "https://127.0.0.1/edge-health"
        headers:
          Host: "{{ item.host }}"
        validate_certs: false
        status_code: 200
      loop: "{{ tenant_health_hosts }}"
      register: tenant_health
      retries: 5
      delay: 2
      until: tenant_health.status == 200

    - name: Publicar estado verificável da edge
      ansible.builtin.copy:
        content: >-
          {{ {'schema_version': 1, 'release_id': release_id,
              'config_digest': config_digest, 'status': 'healthy'}
             | to_nice_json }}
        dest: /opt/cdnmnus/current.json
        owner: root
        group: root
        mode: '0644'
  rescue:
    - name: Restaurar release anterior atomicamente
      ansible.builtin.shell:
        cmd: >-
          set -eu;
          ln -sfn '{{ previous_release.stdout }}' /opt/cdnmnus/.current-rollback;
          mv -Tf /opt/cdnmnus/.current-rollback /opt/cdnmnus/current
        executable: /bin/sh
      when: previous_release_valid | bool

    - name: Restaurar conteúdo das units que existiam
      ansible.builtin.copy:
        content: "{{ item.content | b64decode }}"
        dest: "/etc/systemd/system/{{ item.item.item }}"
        owner: root
        group: root
        mode: '0644'
      loop: "{{ previous_units.results | default([]) }}"
      when: not (item.skipped | default(false))

    - name: Remover units candidatas que não existiam antes
      ansible.builtin.file:
        path: "/etc/systemd/system/{{ item.item }}"
        state: absent
      loop: "{{ previous_unit_stats.results }}"
      when: not item.stat.exists

    - name: Recarregar systemd após restaurar units
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Parar brokers da release candidata antes do rollback
      ansible.builtin.systemd_service:
        name: "cdnmnus-tenant-broker@{{ item }}.service"
        enabled: false
        state: stopped
      loop: "{{ tenant_ids }}"
      when: previous_release_valid | bool

    - name: Parar relays VOD da release candidata antes do rollback
      ansible.builtin.systemd_service:
        name: "cdnmnus-vod-relay@{{ item }}.service"
        enabled: false
        state: stopped
      loop: "{{ vod_tenant_ids | default([]) }}"
      when: previous_release_valid | bool

    - name: Iniciar exatamente os brokers do snapshot anterior
      ansible.builtin.systemd_service:
        name: "cdnmnus-tenant-broker@{{ item }}.service"
        enabled: true
        state: started
      loop: "{{ (previous_snapshot.content | b64decode | from_json).tenants.keys() | list }}"
      when: previous_release_valid | bool

    - name: Iniciar exatamente os relays VOD do snapshot anterior
      ansible.builtin.systemd_service:
        name: "cdnmnus-vod-relay@{{ item }}.service"
        enabled: true
        state: started
      loop: >-
        {{ ((previous_snapshot.content | b64decode | from_json).tenants | dict2items)
           | selectattr('value.vod_hosts', 'defined')
           | rejectattr('value.vod_hosts', 'equalto', [])
           | map(attribute='key') | list }}
      when: previous_release_valid | bool

    - name: Restaurar estado verificável anterior
      ansible.builtin.copy:
        content: >-
          {{ {'schema_version': 1,
              'release_id': (previous_manifest.content | b64decode | from_json).release_id,
              'config_digest': (previous_manifest.content | b64decode | from_json).config_digest,
              'status': 'healthy'} | to_nice_json }}
        dest: /opt/cdnmnus/current.json
        owner: root
        group: root
        mode: '0644'
      when: previous_release_valid | bool

    - name: Remover include quando não havia release anterior
      ansible.builtin.file:
        path: /etc/nginx/conf.d/98-cdnmnus-tenants.conf
        state: absent
      when: not (previous_release_valid | bool)

    - name: Remover symlink candidato quando não havia release anterior
      ansible.builtin.file:
        path: /opt/cdnmnus/current
        state: absent
      when: not (previous_release_valid | bool)

    - name: Parar brokers candidatos quando não havia release anterior
      ansible.builtin.systemd_service:
        name: "cdnmnus-tenant-broker@{{ item }}.service"
        enabled: false
        state: stopped
      loop: "{{ tenant_ids }}"
      when: not (previous_release_valid | bool)

    - name: Parar relays VOD candidatos quando não havia release anterior
      ansible.builtin.systemd_service:
        name: "cdnmnus-vod-relay@{{ item }}.service"
        enabled: false
        state: stopped
      loop: "{{ vod_tenant_ids | default([]) }}"
      when: not (previous_release_valid | bool)

    - name: Remover estado saudável quando não havia release anterior
      ansible.builtin.file:
        path: /opt/cdnmnus/current.json
        state: absent
      when: not (previous_release_valid | bool)

    - name: Validar e recarregar configuração restaurada
      ansible.builtin.shell: nginx -t && systemctl reload nginx
      changed_when: true

    - name: Interromper rollout após rollback
      ansible.builtin.fail:
        msg: Edge restaurada após falha de ativação/health
