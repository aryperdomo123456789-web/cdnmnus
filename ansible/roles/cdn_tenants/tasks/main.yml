---
- name: Exigir release previamente sincronizada
  ansible.builtin.command:
    argv:
      - /usr/local/bin/cdnmnus-verify-release
      - "/opt/cdnmnus/releases/{{ release_id }}"
      - "{{ release_id }}"
      - "{{ config_digest }}"
  changed_when: false

- name: Verificar certificado TLS disponível no control node
  ansible.builtin.stat:
    path: "{{ tls_fullchain_source }}"
  delegate_to: localhost
  become: false
  register: tls_fullchain_local

- name: Verificar chave TLS disponível no control node
  ansible.builtin.stat:
    path: "{{ tls_privkey_source }}"
  delegate_to: localhost
  become: false
  register: tls_privkey_local

- name: Impedir ativação sem certificado TLS válido
  ansible.builtin.assert:
    that:
      - tls_fullchain_local.stat.exists
      - tls_privkey_local.stat.exists
    fail_msg: >-
      Certificado TLS ausente no control node. Distribua/renove o certificado
      antes de provisionar esta edge.
    quiet: true

- name: Criar diretório TLS da edge
  ansible.builtin.file:
    path: "/etc/letsencrypt/live/{{ item.canonical_host }}"
    state: directory
    owner: root
    group: root
    mode: '0700'
  loop: "{{ tenant_contexts }}"
  loop_control:
    label: "{{ item.canonical_host }}"

- name: Distribuir fullchain TLS para cada hostname publicado
  ansible.builtin.copy:
    src: "{{ tls_fullchain_source }}"
    dest: "/etc/letsencrypt/live/{{ item.canonical_host }}/fullchain.pem"
    owner: root
    group: root
    mode: '0644'
  loop: "{{ tenant_contexts }}"
  loop_control:
    label: "{{ item.canonical_host }}"

- name: Distribuir chave privada TLS para cada hostname publicado
  ansible.builtin.copy:
    src: "{{ tls_privkey_source }}"
    dest: "/etc/letsencrypt/live/{{ item.canonical_host }}/privkey.pem"
    owner: root
    group: root
    mode: '0600'
  loop: "{{ tenant_contexts }}"
  loop_control:
    label: "{{ item.canonical_host }}"

- name: Descobrir release ativa anterior
  ansible.builtin.command: readlink -f /opt/cdnmnus/current
  register: previous_release
  changed_when: false
  failed_when: false

- name: Verificar manifesto da release anterior
  ansible.builtin.stat:
    path: "{{ previous_release.stdout }}/manifest.json"
  register: previous_manifest_stat
  when: previous_release.rc == 0 and previous_release.stdout | length > 0

- name: Verificar snapshot da release anterior
  ansible.builtin.stat:
    path: "{{ previous_release.stdout }}/broker/tenants.json"
  register: previous_snapshot_stat
  when: previous_release.rc == 0 and previous_release.stdout | length > 0

- name: Definir se existe rollback anterior íntegro
  ansible.builtin.set_fact:
    previous_release_valid: >-
      {{
        previous_release.rc == 0
        and previous_release.stdout | length > 0
        and previous_manifest_stat.stat.exists | default(false)
        and previous_snapshot_stat.stat.exists | default(false)
      }}

- name: Ler manifesto da release anterior para rollback observável
  ansible.builtin.slurp:
    src: "{{ previous_release.stdout }}/manifest.json"
  register: previous_manifest
  when: previous_release_valid | bool

- name: Ler snapshot anterior para restaurar exatamente seus brokers
  ansible.builtin.slurp:
    src: "{{ previous_release.stdout }}/broker/tenants.json"
  register: previous_snapshot
  when: previous_release_valid | bool

- name: Descobrir units instaladas antes da ativação
  ansible.builtin.stat:
    path: "/etc/systemd/system/{{ item }}"
  loop:
    - cdnmnus-tenant-broker@.service
    - cdnmnus-vod-relay@.service
  register: previous_unit_stats

- name: Preservar conteúdo das units anteriores para rollback
  ansible.builtin.slurp:
    src: "/etc/systemd/system/{{ item.item }}"
  loop: "{{ previous_unit_stats.results }}"
  when: item.stat.exists
  register: previous_units

- name: Verificar estado observável anterior
  ansible.builtin.stat:
    path: /opt/cdnmnus/current.json
  register: previous_current_json_stat

- name: Criar histórico persistente da ativação
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0700'
  loop:
    - /var/lib/cdnmnus-edge
    - /var/lib/cdnmnus-edge/activation-history
    - "/var/lib/cdnmnus-edge/activation-history/{{ release_id }}"

- name: Preservar units anteriores no histórico persistente
  ansible.builtin.copy:
    src: "/etc/systemd/system/{{ item.item }}"
    dest: "/var/lib/cdnmnus-edge/activation-history/{{ release_id }}/{{ item.item }}"
    remote_src: true
    owner: root
    group: root
    mode: '0600'
  loop: "{{ previous_unit_stats.results }}"
  when: item.stat.exists

- name: Preservar estado observável anterior no histórico
  ansible.builtin.copy:
    src: /opt/cdnmnus/current.json
    dest: "/var/lib/cdnmnus-edge/activation-history/{{ release_id }}/current.json"
    remote_src: true
    owner: root
    group: root
    mode: '0600'
  when: previous_current_json_stat.stat.exists

- name: Registrar contrato fechado de rollback da ativação
  ansible.builtin.copy:
    content: >-
      {{ {'schema_version': 1,
          'activated_release_id': release_id,
          'previous_release_id': (previous_manifest.content | b64decode | from_json).release_id,
          'previous_config_digest': (previous_manifest.content | b64decode | from_json).config_digest,
          'tenant_broker_unit_existed': previous_unit_stats.results[0].stat.exists,
          'vod_relay_unit_existed': previous_unit_stats.results[1].stat.exists,
          'current_json_existed': previous_current_json_stat.stat.exists}
         | to_nice_json }}
    dest: "/var/lib/cdnmnus-edge/activation-history/{{ release_id }}/rollback.json"
    owner: root
    group: root
    mode: '0600'
  when: previous_release_valid | bool

- name: Ativar e validar release com rollback
  block:
    - name: Apontar current atomicamente para release candidata
      ansible.builtin.shell:
        cmd: >-
          set -eu;
          ln -sfn '/opt/cdnmnus/releases/{{ release_id }}' /opt/cdnmnus/.current-next;
          mv -Tf /opt/cdnmnus/.current-next /opt/cdnmnus/current
        executable: /bin/sh
      register: active_release_link
      changed_when: previous_release.stdout != '/opt/cdnmnus/releases/' + release_id

    - name: Instalar units da release candidata
      ansible.builtin.copy:
        src: "/opt/cdnmnus/current/runtime/{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        remote_src: true
        owner: root
        group: root
        mode: '0644'
      loop:
        - cdnmnus-tenant-broker@.service
        - cdnmnus-vod-relay@.service
      register: candidate_units

    - name: Recarregar systemd para as units candidatas
      ansible.builtin.systemd_service:
        daemon_reload: true
      when: candidate_units.changed

    - name: Instalar unit do gateway de descoberta CNAME
      ansible.builtin.copy:
        src: "/opt/cdnmnus/current/runtime/cdnmnus-cname-gateway.service"
        dest: /etc/systemd/system/cdnmnus-cname-gateway.service
        remote_src: true
        owner: root
        group: root
        mode: '0644'
      register: cname_gateway_unit

    - name: Recarregar systemd após instalar o gateway CNAME
      ansible.builtin.systemd_service:
        daemon_reload: true
      when: cname_gateway_unit.changed

    - name: Criar diretórios de cache por tenant
      ansible.builtin.file:
        path: "/var/cache/nginx/cdnmnus/{{ item }}"
        state: directory
        owner: www-data
        group: www-data
        mode: '0750'
      loop: "{{ vod_tenant_ids | default([]) }}"

    - name: Remover site padrão da distribuição
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      register: nginx_default_removed

    - name: Instalar servidor padrão fail-closed
      ansible.builtin.copy:
        content: |
          upstream external_alias_origin {
              server {{ external_alias_origin_host }}:{{ external_alias_origin_port }};
              keepalive 32;
          }
          {% if external_alias_has_vod | default(false) %}
          upstream external_alias_vod {
              server unix:/run/cdnmnus/vod-relay-{{ external_alias_tenant_id }}.sock;
              keepalive 32;
          }
          {% endif %}
          {% for item in external_alias_load_balancers | default([]) %}
          upstream external_alias_lb_{{ loop.index0 }} {
              server {{ item.host }}:{{ item.port }};
              keepalive 32;
          }
          {% endfor %}
          server {
              listen 80 default_server;
              server_name _;
              if ($host = cdn.phpd77.com) { return 421; }
              # DNS-only CNAMEs preserve the original Host. Keep aliases out
              # of the database while sending only application paths to the
              # selected tenant; administrative/unknown paths stay blocked.
              location = /get.php {
                  proxy_pass http://external_alias_origin;
                  proxy_set_header Host {{ canonical_health_host }};
                  proxy_set_header Accept-Encoding "";
                  gzip_types application/vnd.apple.mpegurl application/x-mpegURL audio/mpegurl application/octet-stream;
                  proxy_hide_header Content-Type;
                  add_header Content-Type application/vnd.apple.mpegurl always;
                  proxy_hide_header Location;
                  proxy_hide_header Server;
                  sub_filter_types *;
                  sub_filter_once off;
                  sub_filter 'http://{{ external_alias_origin_host }}:{{ external_alias_origin_port }}' 'http://{{ canonical_health_host }}';
                  sub_filter 'http://{{ external_alias_origin_host }}' 'http://{{ canonical_health_host }}';
                  sub_filter 'https://{{ external_alias_origin_host }}:{{ external_alias_origin_port }}' 'http://{{ canonical_health_host }}';
                  sub_filter 'https://{{ external_alias_origin_host }}' 'http://{{ canonical_health_host }}';
              }
              location = /player_api.php {
                  proxy_pass http://external_alias_origin;
                  proxy_set_header Host {{ canonical_health_host }};
                  proxy_hide_header Location;
                  proxy_hide_header Server;
              }
              location ~ ^/(?:hls|live)/ {
                  proxy_pass http://broker_{{ external_alias_tenant_id }};
                  proxy_set_header X-CDN-Tenant {{ external_alias_tenant_id }};
                  proxy_set_header X-CDN-Public-Host {{ canonical_health_host }};
                  proxy_set_header X-Broker-Action resolve;
                  proxy_set_header X-Original-URI $request_uri;
                  proxy_pass_request_body off;
              }
              {% if external_alias_has_vod | default(false) %}
              location ~ ^/(?:movie|series)/ {
                  limit_except GET HEAD { deny all; }
                  proxy_pass http://external_alias_vod;
                  proxy_http_version 1.1;
                  proxy_set_header Connection "";
                  proxy_set_header X-CDN-Public-Host {{ canonical_health_host }};
                  proxy_set_header Range $http_range;
                  proxy_set_header If-Range $http_if_range;
                  proxy_set_header X-Forwarded-For "";
                  proxy_set_header X-Real-IP "";
                  proxy_hide_header Location;
                  proxy_hide_header Server;
                  proxy_hide_header Via;
                  proxy_hide_header X-Powered-By;
                  proxy_hide_header X-Accel-Redirect;
                  proxy_hide_header Set-Cookie;
                  proxy_buffering off;
                  proxy_request_buffering off;
                  proxy_read_timeout 30s;
                  access_log off;
              }
              {% endif %}
              location ~ ^/[^/]+/[^/]+/[0-9]+\.m3u8$ {
                  proxy_pass http://broker_{{ external_alias_tenant_id }};
                  proxy_set_header X-CDN-Tenant {{ external_alias_tenant_id }};
                  proxy_set_header X-CDN-Public-Host {{ canonical_health_host }};
                  proxy_set_header X-Broker-Action resolve;
                  proxy_set_header X-Original-URI $request_uri;
                  proxy_pass_request_body off;
              }
              location ^~ /__cdnmnus_{{ external_alias_tenant_id }}_origin/ {
                  internal;
                  proxy_pass http://external_alias_origin/;
                  proxy_hide_header Location;
                  proxy_hide_header Server;
              }
              {% for item in external_alias_load_balancers | default([]) %}
              location ^~ /__cdnmnus_{{ external_alias_tenant_id }}_lb_{{ loop.index0 }}/ {
                  internal;
                  proxy_pass http://external_alias_lb_{{ loop.index0 }}/;
                  proxy_hide_header Location;
                  proxy_hide_header Server;
              }
              {% endfor %}
              location ~* ^/(?:admin|administrator|phpmyadmin|pma|mysql|database|internal)(?:/|$) {
                  access_log off;
                  return 421;
              }
              location / {
                  return 421;
              }
          }
          server {
              listen 443 ssl default_server;
              server_name _;
              if ($host = cdn.phpd77.com) { return 421; }
              ssl_certificate /etc/letsencrypt/live/{{ canonical_health_host }}/fullchain.pem;
              ssl_certificate_key /etc/letsencrypt/live/{{ canonical_health_host }}/privkey.pem;
              location = /get.php {
                  proxy_pass http://external_alias_origin;
                  proxy_set_header Host {{ canonical_health_host }};
                  proxy_set_header Accept-Encoding "";
                  gzip_types application/vnd.apple.mpegurl application/x-mpegURL audio/mpegurl application/octet-stream;
                  proxy_hide_header Content-Type;
                  add_header Content-Type application/vnd.apple.mpegurl always;
                  proxy_hide_header Location;
                  proxy_hide_header Server;
                  sub_filter_types *;
                  sub_filter_once off;
                  sub_filter 'http://{{ external_alias_origin_host }}:{{ external_alias_origin_port }}' 'http://{{ canonical_health_host }}';
                  sub_filter 'http://{{ external_alias_origin_host }}' 'http://{{ canonical_health_host }}';
                  sub_filter 'https://{{ external_alias_origin_host }}:{{ external_alias_origin_port }}' 'http://{{ canonical_health_host }}';
                  sub_filter 'https://{{ external_alias_origin_host }}' 'http://{{ canonical_health_host }}';
              }
              location = /player_api.php {
                  proxy_pass http://origin_{{ external_alias_tenant_id }};
                  proxy_set_header Host {{ canonical_health_host }};
                  proxy_hide_header Location;
                  proxy_hide_header Server;
              }
              location ~ ^/(?:hls|live)/ {
                  proxy_pass http://broker_{{ external_alias_tenant_id }};
                  proxy_set_header X-CDN-Tenant {{ external_alias_tenant_id }};
                  proxy_set_header X-CDN-Public-Host {{ canonical_health_host }};
                  proxy_set_header X-Broker-Action resolve;
                  proxy_set_header X-Original-URI $request_uri;
                  proxy_pass_request_body off;
              }
              {% if external_alias_has_vod | default(false) %}
              location ~ ^/(?:movie|series)/ {
                  limit_except GET HEAD { deny all; }
                  proxy_pass http://external_alias_vod;
                  proxy_http_version 1.1;
                  proxy_set_header Connection "";
                  proxy_set_header X-CDN-Public-Host {{ canonical_health_host }};
                  proxy_set_header Range $http_range;
                  proxy_set_header If-Range $http_if_range;
                  proxy_set_header X-Forwarded-For "";
                  proxy_set_header X-Real-IP "";
                  proxy_hide_header Location;
                  proxy_hide_header Server;
                  proxy_hide_header Via;
                  proxy_hide_header X-Powered-By;
                  proxy_hide_header X-Accel-Redirect;
                  proxy_hide_header Set-Cookie;
                  proxy_buffering off;
                  proxy_request_buffering off;
                  proxy_read_timeout 30s;
                  access_log off;
              }
              {% else %}
              location ~ ^/(?:movie|series)/ {
                  access_log off;
                  return 503;
              }
              {% endif %}
              location ~* ^/(?:admin|administrator|phpmyadmin|pma|mysql|database|internal)(?:/|$) {
                  access_log off;
                  return 421;
              }
              location ~ ^/[^/]+/[^/]+/[0-9]+\.m3u8$ {
                  proxy_pass http://broker_{{ external_alias_tenant_id }};
                  proxy_set_header X-CDN-Tenant {{ external_alias_tenant_id }};
                  proxy_set_header X-CDN-Public-Host {{ canonical_health_host }};
                  proxy_set_header X-Broker-Action resolve;
                  proxy_set_header X-Original-URI $request_uri;
                  proxy_pass_request_body off;
              }
              location / {
                  return 421;
              }
          }
        dest: /etc/nginx/conf.d/97-cdnmnus-default.conf
        owner: root
        group: root
        mode: '0644'
      register: nginx_fail_closed
      when: not (automatic_cname_discovery | default(false) | bool)

    - name: Instalar gateway padrão de descoberta CNAME
      ansible.builtin.copy:
        content: |
          upstream cname_gateway {
              server unix:/run/cdnmnus/cname-gateway.sock;
              keepalive 32;
          }
          server {
              listen 80 default_server;
              server_name _;
              location = /get.php { proxy_pass http://cname_gateway; proxy_set_header Host $host; proxy_set_header Connection ""; proxy_hide_header Server; proxy_hide_header Location; proxy_read_timeout 180s; proxy_send_timeout 180s; }
              location = /player_api.php { proxy_pass http://cname_gateway; proxy_set_header Host $host; proxy_set_header Connection ""; proxy_hide_header Server; proxy_hide_header Location; proxy_hide_header Set-Cookie; }
              location ~ ^/(?:hls|live|movie|series)/ { proxy_pass http://cname_gateway; proxy_set_header Host $host; proxy_set_header Connection ""; proxy_hide_header Server; proxy_hide_header Location; proxy_hide_header Set-Cookie; proxy_buffering off; }
              location ~ ^/[^/]+/[^/]+/[0-9]+\.m3u8$ { proxy_pass http://cname_gateway; proxy_set_header Host $host; proxy_set_header Connection ""; proxy_hide_header Server; proxy_hide_header Location; proxy_buffering off; }
              # Provider manifests are accepted only in this strict shape;
              # every other unknown path remains fail-closed below.
              location ~ "^/play/[A-Za-z0-9_-]{8,256}(?:/m3u8)?$" { proxy_pass http://cname_gateway; proxy_set_header Host $host; proxy_set_header Connection ""; proxy_hide_header Server; proxy_hide_header Location; proxy_buffering off; }
              location ~* ^/(?:admin|administrator|phpmyadmin|pma|mysql|database|internal)(?:/|$) { access_log off; return 421; }
              location / { return 421; }
          }
          server {
              listen 443 ssl default_server;
              server_name _;
              ssl_certificate /etc/letsencrypt/live/{{ canonical_health_host }}/fullchain.pem;
              ssl_certificate_key /etc/letsencrypt/live/{{ canonical_health_host }}/privkey.pem;
              location = /get.php { proxy_pass http://cname_gateway; proxy_set_header Host $host; proxy_set_header Connection ""; proxy_hide_header Server; proxy_hide_header Location; proxy_read_timeout 180s; proxy_send_timeout 180s; }
              location = /player_api.php { proxy_pass http://cname_gateway; proxy_set_header Host $host; proxy_set_header Connection ""; proxy_hide_header Server; proxy_hide_header Location; proxy_hide_header Set-Cookie; }
              location ~ ^/(?:hls|live|movie|series)/ { proxy_pass http://cname_gateway; proxy_set_header Host $host; proxy_set_header Connection ""; proxy_hide_header Server; proxy_hide_header Location; proxy_hide_header Set-Cookie; proxy_buffering off; }
              location ~ ^/[^/]+/[^/]+/[0-9]+\.m3u8$ { proxy_pass http://cname_gateway; proxy_set_header Host $host; proxy_set_header Connection ""; proxy_hide_header Server; proxy_hide_header Location; proxy_buffering off; }
              location ~ "^/play/[A-Za-z0-9_-]{8,256}(?:/m3u8)?$" { proxy_pass http://cname_gateway; proxy_set_header Host $host; proxy_set_header Connection ""; proxy_hide_header Server; proxy_hide_header Location; proxy_buffering off; }
              location ~* ^/(?:admin|administrator|phpmyadmin|pma|mysql|database|internal)(?:/|$) { access_log off; return 421; }
              location / { return 421; }
          }
        dest: /etc/nginx/conf.d/97-cdnmnus-default.conf
        owner: root
        group: root
        mode: '0644'
      register: nginx_cname_gateway
      when: automatic_cname_discovery | default(false) | bool

    - name: Instalar include do runtime multi-tenant
      ansible.builtin.copy:
        content: |
          include /opt/cdnmnus/current/nginx/tenants/*.conf;
        dest: /etc/nginx/conf.d/98-cdnmnus-tenants.conf
        owner: root
        group: root
        mode: '0644'
      register: tenant_nginx_include

    - name: Habilitar brokers dos tenants
      ansible.builtin.systemd_service:
        name: "cdnmnus-tenant-broker@{{ item }}.service"
        enabled: true
        state: started
      loop: "{{ tenant_ids }}"

    - name: Reiniciar gateway de descoberta CNAME para carregar a release ativa
      ansible.builtin.systemd_service:
        name: cdnmnus-cname-gateway.service
        enabled: true
        state: restarted
      when: automatic_cname_discovery | default(false) | bool

    - name: Desabilitar gateway quando a descoberta estiver desligada
      ansible.builtin.systemd_service:
        name: cdnmnus-cname-gateway.service
        enabled: false
        state: stopped
      when: not (automatic_cname_discovery | default(false) | bool)
      failed_when: false

    - name: Habilitar relays VOD dos tenants
      ansible.builtin.systemd_service:
        name: "cdnmnus-vod-relay@{{ item }}.service"
        enabled: true
        state: started
      loop: "{{ vod_tenant_ids | default([]) }}"

    - name: Validar Nginx candidato
      ansible.builtin.command: nginx -t
      changed_when: false

    - name: Reiniciar brokers para carregar o snapshot candidato
      ansible.builtin.systemd_service:
        name: "cdnmnus-tenant-broker@{{ item }}.service"
        state: restarted
      loop: "{{ tenant_ids }}"

    - name: Reiniciar relays VOD para carregar o snapshot candidato
      ansible.builtin.systemd_service:
        name: "cdnmnus-vod-relay@{{ item }}.service"
        state: restarted
      loop: "{{ vod_tenant_ids | default([]) }}"

    - name: Habilitar Nginx
      ansible.builtin.systemd_service:
        name: nginx
        enabled: true
        state: started

    - name: Recarregar Nginx quando a configuração mudou
      ansible.builtin.systemd_service:
        name: nginx
        state: reloaded
      when: active_release_link.changed or tenant_nginx_include.changed
            or nginx_default_removed.changed or nginx_fail_closed.changed
            or nginx_cname_gateway.changed | default(false)

    - name: Validar health local por tenant
      ansible.builtin.uri:
        url: "https://127.0.0.1/edge-health"
        headers:
          Host: "{{ item.host }}"
        validate_certs: false
        status_code: 200
      loop: "{{ tenant_health_hosts }}"
      register: tenant_health
      retries: 5
      delay: 2
      until: tenant_health.status == 200

    - name: Publicar estado verificável da edge
      ansible.builtin.copy:
        content: >-
          {{ {'schema_version': 1, 'release_id': release_id,
              'config_digest': config_digest, 'status': 'healthy'}
             | to_nice_json }}
        dest: /opt/cdnmnus/current.json
        owner: root
        group: root
        mode: '0644'
  rescue:
    - name: Restaurar release anterior atomicamente
      ansible.builtin.shell:
        cmd: >-
          set -eu;
          ln -sfn '{{ previous_release.stdout }}' /opt/cdnmnus/.current-rollback;
          mv -Tf /opt/cdnmnus/.current-rollback /opt/cdnmnus/current
        executable: /bin/sh
      when: previous_release_valid | bool

    - name: Restaurar conteúdo das units que existiam
      ansible.builtin.copy:
        content: "{{ item.content | b64decode }}"
        dest: "/etc/systemd/system/{{ item.item.item }}"
        owner: root
        group: root
        mode: '0644'
      loop: "{{ previous_units.results | default([]) }}"
      when: not (item.skipped | default(false))

    - name: Remover units candidatas que não existiam antes
      ansible.builtin.file:
        path: "/etc/systemd/system/{{ item.item }}"
        state: absent
      loop: "{{ previous_unit_stats.results }}"
      when: not item.stat.exists

    - name: Recarregar systemd após restaurar units
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Parar gateway da candidata durante rollback
      ansible.builtin.systemd_service:
        name: cdnmnus-cname-gateway.service
        enabled: false
        state: stopped
      failed_when: false

    - name: Reativar gateway se a release restaurada o exigir
      ansible.builtin.systemd_service:
        name: cdnmnus-cname-gateway.service
        enabled: true
        state: started
      when: >-
        previous_release_valid | bool and
        ((previous_snapshot.content | b64decode | from_json).automatic_cname_discovery | default(false) | bool)
      failed_when: false

    - name: Parar brokers da release candidata antes do rollback
      ansible.builtin.systemd_service:
        name: "cdnmnus-tenant-broker@{{ item }}.service"
        enabled: false
        state: stopped
      loop: "{{ tenant_ids }}"
      when: previous_release_valid | bool

    - name: Parar relays VOD da release candidata antes do rollback
      ansible.builtin.systemd_service:
        name: "cdnmnus-vod-relay@{{ item }}.service"
        enabled: false
        state: stopped
      loop: "{{ vod_tenant_ids | default([]) }}"
      when: previous_release_valid | bool

    - name: Iniciar exatamente os brokers do snapshot anterior
      ansible.builtin.systemd_service:
        name: "cdnmnus-tenant-broker@{{ item }}.service"
        enabled: true
        state: started
      loop: "{{ (previous_snapshot.content | b64decode | from_json).tenants.keys() | list }}"
      when: previous_release_valid | bool

    - name: Iniciar exatamente os relays VOD do snapshot anterior
      ansible.builtin.systemd_service:
        name: "cdnmnus-vod-relay@{{ item }}.service"
        enabled: true
        state: started
      loop: >-
        {{ ((previous_snapshot.content | b64decode | from_json).tenants | dict2items)
           | selectattr('value.vod_hosts', 'defined')
           | rejectattr('value.vod_hosts', 'equalto', [])
           | map(attribute='key') | list }}
      when: previous_release_valid | bool

    - name: Restaurar estado verificável anterior
      ansible.builtin.copy:
        content: >-
          {{ {'schema_version': 1,
              'release_id': (previous_manifest.content | b64decode | from_json).release_id,
              'config_digest': (previous_manifest.content | b64decode | from_json).config_digest,
              'status': 'healthy'} | to_nice_json }}
        dest: /opt/cdnmnus/current.json
        owner: root
        group: root
        mode: '0644'
      when: previous_release_valid | bool

    - name: Remover include quando não havia release anterior
      ansible.builtin.file:
        path: /etc/nginx/conf.d/98-cdnmnus-tenants.conf
        state: absent
      when: not (previous_release_valid | bool)

    - name: Remover symlink candidato quando não havia release anterior
      ansible.builtin.file:
        path: /opt/cdnmnus/current
        state: absent
      when: not (previous_release_valid | bool)

    - name: Parar brokers candidatos quando não havia release anterior
      ansible.builtin.systemd_service:
        name: "cdnmnus-tenant-broker@{{ item }}.service"
        enabled: false
        state: stopped
      loop: "{{ tenant_ids }}"
      when: not (previous_release_valid | bool)

    - name: Parar relays VOD candidatos quando não havia release anterior
      ansible.builtin.systemd_service:
        name: "cdnmnus-vod-relay@{{ item }}.service"
        enabled: false
        state: stopped
      loop: "{{ vod_tenant_ids | default([]) }}"
      when: not (previous_release_valid | bool)

    - name: Remover estado saudável quando não havia release anterior
      ansible.builtin.file:
        path: /opt/cdnmnus/current.json
        state: absent
      when: not (previous_release_valid | bool)

    - name: Validar e recarregar configuração restaurada
      ansible.builtin.shell: nginx -t && systemctl reload nginx
      changed_when: true

    - name: Interromper rollout após rollback
      ansible.builtin.fail:
        msg: Edge restaurada após falha de ativação/health
