---
# Must be supplied by inventory or by the caller. A load balancer must never
# infer the legacy .111 host as its control-plane.
cdnmnus_control_plane_host: ""
cdnmnus_control_plane_port: 22
cdnmnus_control_plane_scheme: ssh
cdnmnus_control_plane_verify: true
cdnmnus_node_bootstrap_mode: managed
cdnmnus_node_role: edge
cdnmnus_node_state: bootstrapping
cdnmnus_node_name: "Nó {{ cdnmnus_node_id }}"
cdnmnus_release_id: ""
cdnmnus_config_digest: ""
