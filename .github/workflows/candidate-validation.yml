name: Candidate validation

on:
  push:
    branches:
      - main
      - production/**
    tags:
      - "v*-production-candidate*"
  pull_request:

permissions:
  contents: read

concurrency:
  group: candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout fechado no commit do evento
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Impedir credenciais e artefatos privados rastreados
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -Eiq '(^|/)([^/]*\.env([^/]*)?|[^/]*\.(db|sqlite|sqlite3|pem|key|p12|pfx|jks|ed25519|age|7z|m3u|m3u8))$'; then
            echo "Arquivo privado rastreado pelo Git" >&2
            exit 1
          fi
          if git grep -nEI 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|Authorization:[[:space:]]*(Basic|Bearer)' -- . ':(exclude)docs/**'; then
            echo "Possível segredo encontrado" >&2
            exit 1
          fi

      - name: Compilar fontes Python
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          for path in Path('.').rglob('*.py'):
              compile(path.read_bytes(), str(path), 'exec')
          PY

      - name: Executar testes funcionais
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}
          TMPDIR: /tmp
        run: |
          set -euo pipefail
          for test in \
            tests/admin_core_test.py \
            tests/admin_web_test.py \
            tests/edge_manager_test.py \
            tests/release_integrity_test.py \
            tests/multi_tenant_broker_test.py \
            tests/panel_http_test.py \
            tests/token_broker_test.py \
            tests/vod_relay_test.py \
            tests/vod_player_compatibility_test.py
          do
            python "$test"
          done

      - name: Executar smoke e verificar whitespace
        shell: bash
        run: |
          set -euo pipefail
          bash tests/smoke.sh
          git diff --check

      - name: Validar sintaxe dos playbooks com Ansible suportado
        shell: bash
        env:
          ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check ansible-core==2.17.14
          cp ansible/inventories/production/hosts.yml.example /tmp/cdnmnus-hosts.yml
          extra_vars='{"release_id":"20260829012407-d60cfdbf","release_source":"/tmp/release","config_digest":"9e5457a1dd27609a573c0fd7cbcc80db1d84378da118d7e0dc70d70d7a534eb0","canonical_health_host":"canary.invalid","tenant_ids":["xui-principal"],"vod_tenant_ids":["xui-principal"],"tenant_health_hosts":[{"host":"canary.invalid"}]}'
          for playbook in \
            ansible/playbooks/preflight-edge.yml \
            ansible/playbooks/deploy-edge.yml \
            ansible/playbooks/activate-edge.yml \
            ansible/playbooks/deploy-and-activate-edge.yml \
            ansible/playbooks/rollback-edge.yml \
            ansible/playbooks/install-node-menu.yml \
            ansible/playbooks/audit-edge-releases.yml
          do
            ansible-playbook --syntax-check -i /tmp/cdnmnus-hosts.yml "$playbook" --extra-vars "$extra_vars"
          done
